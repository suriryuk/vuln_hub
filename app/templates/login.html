<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 페이지</title>
    <link rel="stylesheet" href="/assets/login.css">
</head>
<body>
    <div class="login-container">
        <h2>로그인</h2>
        <div id="message-container"></div> <!-- 메시지를 표시할 요소 -->

        <form id="login-form">
            <label for="username">아이디:</label>
            <input type="text" id="username" name="userid" required>
            
            <label for="password">비밀번호:</label>
            <input type="password" id="password" name="password" required>
            
            <input type="submit" id="submit-button" value="로그인">
        </form>

        <p class="register-link">
            계정 만들기 <a href="/auth/register">회원가입</a>
        </p>
    </div>

    <script>
        // 폼 데이터 전송 로직
        async function sendLoginRequest(event) {
            // 기본 제출 동작 막기
            event.preventDefault();

            // 폼 데이터 수집
            const userid = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            // 유효성 검사
            if (!userid || !password) {
                displayMessage('아이디와 비밀번호를 입력하세요.', 'error');
                return;
            }

            // 서버로 보낼 JSON 데이터 구성
            const requestData = { userid, password };

            try {
                // 서버로 JSON 데이터를 POST 요청
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestData)
                });

                // 응답 처리
                const result = await response.json();

                if (response.ok) {
                    // 성공 메시지 표시
                    displayMessage(result.message || '로그인 성공!', 'success');
                } else {
                    // 실패 메시지 표시
                    displayMessage(result.error || '로그인 실패!', 'error');
                }
            } catch (error) {
                // 네트워크 오류 처리
                displayMessage('네트워크 오류가 발생했습니다. 다시 시도해주세요.', 'error');
                console.error('로그인 요청 중 오류 발생:', error);
            }
        }

        // 메시지를 표시하는 함수
        function displayMessage(message, type) {
            const messageContainer = document.getElementById('message-container');
            messageContainer.innerHTML = `<div class="message ${type}">${message}</div>`;
        }

        // 폼 제출 이벤트 처리
        const loginForm = document.getElementById('login-form');
        loginForm.addEventListener('submit', sendLoginRequest);
    </script>
</body>
</html>
