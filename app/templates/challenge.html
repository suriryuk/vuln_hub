<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>문제 목록</title>
    <link rel="stylesheet" href="/assets/challenge.css" />
</head>
<body>
    <header class="main-header">
        <div class="logo">
            <a href="/">Dashboard</a>
        </div>
        <nav class="main-nav-left">
            <a href="/">home</a>
            <a href="/challenge">challenge</a>
            <a href="#">menu2</a>
            <a href="#">menu3</a>
        </nav>
        <nav class="main-nav-right">
            {% if admin %}
            <a href="/admin" class="profile-link">{{ user_id }}</a>
            {% else %}
            <a href="#" class="profile-link">{{ user_id }}</a>
            {% endif %}
            <a href="/auth/logout" class="logout-link">Logout</a>
        </nav>
    </header>

    <main class="main-content-problem-list">
        <section class="problem-list">
            <article class="problem-item">
                <div class="problem-info">
                    <h4 class="problem-title">문제 이름 1</h4>
                    <p class="problem-description">문제 설명이 여기에 들어갑니다. 문제에 대한 간단한 설명을 작성합니다.</p>
                </div>
                <div class="problem-score">점수: 100</div>
            </article>

            <article class="problem-item">
                <div class="problem-info">
                    <h4 class="problem-title">문제 이름 2</h4>
                    <p class="problem-description">다른 문제 설명이 여기에 들어갑니다. 문제의 난이도나 특징을 간략히 적습니다.</p>
                </div>
                <div class="problem-score">점수: 80</div>
            </article>

            <article class="problem-item">
                <div class="problem-info">
                    <h4 class="problem-title">문제 이름 3</h4>
                    <p class="problem-description">추가 문제 설명입니다. 문제에 대한 부가 정보를 넣을 수 있습니다.</p>
                </div>
                <div class="problem-score">점수: 60</div>
            </article>
        </section>
    </main>
</body>
</html>
