<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link rel="stylesheet" href="/assets/register.css"> <!-- CSS 연결 -->
</head>
<body>
    <div class="register-container">
        <h2>회원가입</h2>
        <div id="message-container"></div> <!-- 메시지를 출력할 요소 -->

        <form id="register-form">
            <label for="username">아이디</label>
            <input type="text" id="username" name="userid" required>
            
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" required>
            
            <label for="confirm-password">비밀번호 확인</label>
            <input type="password" id="confirm-password" name="confirm_password" required>
            
            <label for="nickname">닉네임</label>
            <input type="text" id="nickname" name="nickname" required>
            
            <input type="submit" value="회원가입">
        </form>

        <p class="login-link">
            로그인하기 <a href="/auth/login">로그인</a>
        </p>
    </div>

    <script>
        // 메시지를 화면에 출력하는 함수
        function displayMessage(message, type) {
            const messageContainer = document.getElementById('message-container');
            messageContainer.innerHTML = `<div class="message ${type}">${message}</div>`;
        }
    
        // 폼 데이터 전송 처리
        async function handleRegister(event) {
            event.preventDefault(); // 기본 폼 제출 동작 막기
            
            // 데이터 수집
            const userid = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const confirmPassword = document.getElementById('confirm-password').value.trim();
            const nickname = document.getElementById('nickname').value.trim();
    
            // 유효성 검사
            if (!userid || !password || !nickname) {
                displayMessage('모든 필드를 입력해주세요.', 'error');
                return;
            }
    
            if (password !== confirmPassword) {
                displayMessage('비밀번호가 일치하지 않습니다.', 'error');
                return;
            }
    
            // 서버로 데이터 전송
            try {
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ userid, password, nickname }),
                });
    
                const result = await response.json(); // 서버 응답 처리
                if (response.ok) {
                    displayMessage(result.message || '회원가입이 성공적으로 완료되었습니다.', 'success'); // 성공 메시지
                } else {
                    displayMessage(result.detail || '회원가입에 실패했습니다.', 'error'); // 에러 메시지
                }
            } catch (error) {
                displayMessage('네트워크 오류가 발생했습니다. 다시 시도해주세요.', 'error'); // 네트워크 오류 메시지
                console.error('회원가입 요청 중 오류 발생:', error);
            }
        }
    
        // 폼 제출 이벤트 리스너 추가
        const registerForm = document.getElementById('register-form');
        registerForm.addEventListener('submit', handleRegister);
    </script>
</body>
</html>
