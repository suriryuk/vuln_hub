version: '3'
services:
  db:
    image: mysql:latest
    container_name: vuln_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 'root'
      MYSQL_USER: 'user'
      MYSQL_PASSWORD: 'password'
      MYSQL_DATABASE: 'vuln'
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always
    networks:
      - vuln_hub_internal

  web:
    build: ./app
    container_name: vuln_web
    volumes:
      - ./app:/app
    ports:
      - "8000:8000"
      - "80:8000"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=vuln
    restart: always
    networks:
      - vuln_hub_external
      - vuln_hub_internal

volumes:
  mysql_data:

networks:
  vuln_hub_external:
    external: true
  vuln_hub_internal:
    internal: true